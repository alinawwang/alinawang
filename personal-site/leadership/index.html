---
layout: default
title: Leadership
---

<section id="leadership">
  <div class="wrap">
    <h2>Leadership &amp; Outreach</h2>
    {% for l in site.data.leadership %}
    <div class="entry">
      <div class="entry-head">
        <h3>{{ l.org }}</h3>
        {% if l.period %}<span class="meta">{{ l.period }}</span>{% endif %}
      </div>
      <p class="org">{{ l.role }}</p>
      <p class="desc">{{ l.description }}</p>
    </div>
    {% endfor %}
  </div>
</section>
