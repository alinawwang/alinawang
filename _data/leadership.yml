- org: "Engineering Society at UCLA (ESUC)"
  roles:
    - role: "Publicity Chair"
      period: "March 2026 – Present"
      description: >
        Manage ESUC's social and networking accounts, growing engagement
        and visibility for club events. Design promotional flyers and
        coordinate student leader outreach; support intern recruitment
        at Engineering Welcome Day and Club Fairs; coordinate officer
        headshots for club branding.

- org: "Society of Women Engineers (SWE) at UCLA"
  roles:
    - role: "Outreach Committee Publicity"
      period: "June 2026 – Present"
      description: >
        Promote K-12 outreach initiatives introducing girls to
        engineering through hands-on activities and STEM exposure.
        Design marketing materials and manage publicity strategy;
        build partnerships between the Outreach Committee and
        community organizations.
    - role: "Project Scientist Activity Lead"
      period: "September 2025 – June 2026"
      description: >
        Expanded access to STEM education for elementary through high
        school students across the LA area, reaching 150+ girls.
        Designed and led hands-on activities for the flagship Project
        Scientist event; coordinated event logistics and supply
        planning.

- org: "American Society of Civil Engineers (ASCE) at UCLA"
  roles:
    - role: "Seismic Outreach Project Manager"
      period: "June 2026 – Present"
      description: >
        Lead the Seismic Outreach project, coordinating curriculum and
        timelines to reach 150+ students per quarter across 3 quarters.
        Design earthquake engineering activities teaching K-12 students
        seismic safety and structural concepts; partner with ASCE
        officers to plan events and expand outreach materials.
