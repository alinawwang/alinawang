- title: "Evaluating Data Sources for the Corcoran Clay Confining Unit"
  org: "Department of Geophysics, Stanford Doerr School of Sustainability"
  role: "Research Assistant"
  period: "June 2026 – September 2026"
  advisors: "Prof. Rosemary J. Knight & Ph.D. Candidate Jonathan Mells"
  description: >
    Georeferenced and spatially digitized historical USGS geologic
    plates in ArcGIS Pro into control-point-registered vector layers.
    Built a spatial well-log database by geoprocessing USGS subsurface
    texture records into queryable GIS point feature classes, and
    developed a comparative framework assessing airborne
    electromagnetic (AEM) survey data against legacy well-log records
    for aquifer characterization in California's Central Valley.
