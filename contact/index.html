---
layout: default
title: Contact
---

<section id="contact">
  <div class="wrap">
    <h2>Contact</h2>
    <p class="lede">
      <span class="email-obfuscated">{{ site.email | replace: "@", " [at] " | replace: ".", " [dot] " }}</span><br>
      <a href="https://github.com/{{ site.github_username }}">github.com/{{ site.github_username }}</a><br>
      <a href="{{ site.linkedin_url }}">LinkedIn</a><br>
      <a href="{{ site.resume_url | relative_url }}">Résumé (PDF)</a>
    </p>
  </div>
</section>
