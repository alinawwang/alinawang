---
layout: default
title: Leadership
---

<section id="leadership">
  <div class="wrap">
    <h2>Leadership and Student Organization Involvement</h2>
    {% for o in site.data.leadership %}
    <div class="entry">
      <div class="entry-head">
        <h3>{{ o.org }}</h3>
      </div>
      {% for r in o.roles %}
      <div class="role">
        <div class="role-head">
          <span class="role-title">{{ r.role }}</span>
          {% if r.period %}<span class="meta">{{ r.period }}</span>{% endif %}
        </div>
        <p class="desc">{{ r.description }}</p>
      </div>
      {% endfor %}
    </div>
    {% endfor %}
  </div>
</section>
